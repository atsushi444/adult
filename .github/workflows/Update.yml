name: Update

on:
  push:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  Update:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: GetTime
      run: echo "GET_TIME=$(date +'%Y-%m-%d %H:%M:%S CST')" >> $GITHUB_ENV

    - name: Update
      run: |
        # 清理旧文件
        rm -f General.m3u && touch General.m3u

        # 下载源文件
        wget -q https://raw.githubusercontent.com/atsushi444/iptv/refs/heads/main/adult.m3u -O source.m3u
        wget -q https://raw.githubusercontent.com/atsushi444/iptv/refs/heads/main/adult2.m3u -O source2.m3u
        wget -q https://raw.githubusercontent.com/atsushi444/iptv/refs/heads/main/vod/list7.m3u -O source3.m3u
        wget -q https://raw.githubusercontent.com/atsushi444/iptv/refs/heads/main/vod/list4.m3u -O source4.m3u
        wget -q https://raw.githubusercontent.com/atsushi444/iptv/refs/heads/main/vod/list10.m3u -O source5.m3u

        # 提取各个分类（把需要的分类都写在这里）
        sed -n '/ASIATICO/,+1p' source.m3u >> General.m3u
        sed -n '/ASIATICO/,+1p' source3.m3u >> General.m3u

        sed -n '/UNCENSORED/,+1p' source.m3u >> General.m3u
        sed -n '/SIN CENSURA/,+1p' source.m3u >> General.m3u
        sed -n '/SIN CENSURA/,+1p' source4.m3u >> General.m3u

        sed -n '/CENSORED/,+1p' source.m3u >> General.m3u
        sed -n '/AMATEUR/,+1p' source.m3u >> General.m3u
        sed -n '/DESTRUCCION MOSAICO/,+1p' source.m3u >> General.m3u
        sed -n '/CENSURA/,+1p' source.m3u >> General.m3u

        sed -n '/PORN/,+1p' source.m3u >> General.m3u
        sed -n '/PORN/,+1p' source5.m3u >> General.m3u
        
        sed -n '/Mya Mya/,+1p' source.m3u >> General.m3u
        sed -n '/Gattouz/,+1p' source.m3u >> General.m3u
        sed -n '/PELICULAS/,+1p' source.m3u >> General.m3u
        sed -n '/ANIME/,+1p' source.m3u >> General.m3u

        sed -n '/DAHLIA/,+1p' source2.m3u >> General.m3u
        sed -n '/BOTAN/,+1p' source2.m3u >> General.m3u
        sed -n '/即席シロウト/,+1p' source2.m3u >> General.m3u
        sed -n '/カミパイ/,+1p' source2.m3u >> General.m3u
        sed -n '/BonキュンBon/,+1p' source2.m3u >> General.m3u
        sed -n '/ダスッ！/,+1p' source2.m3u >> General.m3u
        sed -n '/ダスッ！/,+1p' source2.m3u >> General.m3u
        
        # 处理头部和空行
        sed -i '/#EXTM3U/d' General.m3u          # 先删除已有的 #EXTM3U
        sed -i '1i #EXTM3U' General.m3u          # 在开头插入
        sed -i '/^\s*$/d' General.m3u            # 删除空行

        # 清理临时文件
        rm -f source.m3u source2.m3u source3.m3u source4.m3u source5.m3u

        # 更新 README
        echo "Auto Update IPTV in ${GET_TIME}" > README.md

    - name: Clean
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git checkout --orphan latest_branch
        git add -A
        git commit -am "${GET_TIME}" || echo "No changes to commit"
        git branch -D main || true
        git branch -m main

    - name: Push
      run: git push -f origin main
