name: Merge IPTV Playlists (with Dead Link Check)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: merge-iptv
  cancel-in-progress: true

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run merge script
        run: python3 scripts/merge.py

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet playlist.m3u dead.m3u 2>/dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "内容无变化"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "播放列表已更新"
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u dead.m3u
          git commit -m "chore: update playlist + dead list $(date -u +%Y-%m-%d)"
          git push
