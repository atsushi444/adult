name: Merge IPTV Playlists

on:
  schedule:
    # 每 6 小时运行一次（UTC 时间）
    - cron: '0 */6 * * *'
  workflow_dispatch:   # 支持手动触发

concurrency:
  group: merge-iptv
  cancel-in-progress: true

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 需要写权限才能 push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Merge playlists
        run: |
          python3 << 'EOF'
          import os
          import re
          import urllib.request
          from datetime import datetime, timezone

          # ========== 配置 ==========
          SOURCES_FILE = "sources.txt"
          PERSONAL_FILE = "personal.m3u"      # 可选个人频道
          OUTPUT_FILE = "playlist.m3u"
          # =========================

          def download(url: str) -> str:
              try:
                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0 (compatible; IPTV-Merger/1.0)"}
                  )
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return resp.read().decode("utf-8", errors="ignore")
              except Exception as e:
                  print(f"[WARN] Failed to download {url}: {e}")
                  return ""

          def parse_m3u(content: str, source_name: str = "") -> list[tuple[str, str]]:
              """返回 [(extinf_line, url), ...]"""
              entries = []
              lines = content.strip().splitlines()
              i = 0
              while i < len(lines):
                  line = lines[i].strip()
                  if line.startswith("#EXTINF"):
                      extinf = line
                      # 强制加上/覆盖 group-title
                      if source_name:
                          if 'group-title="' in extinf:
                              extinf = re.sub(r'group-title="[^"]*"', f'group-title="{source_name}"', extinf)
                          else:
                              extinf = extinf.replace("#EXTINF:", f'#EXTINF:-1 group-title="{source_name}",', 1)
                      i += 1
                      if i < len(lines) and not lines[i].startswith("#"):
                          url = lines[i].strip()
                          if url:
                              entries.append((extinf, url))
                  i += 1
              return entries

          # 收集所有条目，按 URL 去重（保留第一次出现的）
          seen_urls = set()
          merged = []

          # 1. 优先合并个人频道
          if os.path.exists(PERSONAL_FILE):
              print(f"Loading personal: {PERSONAL_FILE}")
              with open(PERSONAL_FILE, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()
              for extinf, url in parse_m3u(content, "Personal"):
                  if url not in seen_urls:
                      seen_urls.add(url)
                      merged.append((extinf, url))

          # 2. 从 sources.txt 加载远程源
          if os.path.exists(SOURCES_FILE):
              with open(SOURCES_FILE, "r", encoding="utf-8") as f:
                  sources = [line.strip() for line in f if line.strip() and not line.startswith("#")]
          else:
              sources = []

          for idx, url in enumerate(sources, 1):
              print(f"[{idx}/{len(sources)}] Downloading: {url}")
              content = download(url)
              if not content:
                  continue

              # 用域名或序号作为 group 名称
              source_name = f"Source-{idx}"
              try:
                  from urllib.parse import urlparse
                  host = urlparse(url).netloc
                  if host:
                      source_name = host.split(":")[0]
              except:
                  pass

              for extinf, stream_url in parse_m3u(content, source_name):
                  if stream_url not in seen_urls:
                      seen_urls.add(stream_url)
                      merged.append((extinf, stream_url))

          # 生成最终文件
          header = f"""#EXTM3U
# Generated by GitHub Actions
# Updated: {datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")}
# Total channels: {len(merged)}
"""

          with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
              f.write(header)
              for extinf, url in merged:
                  f.write(extinf + "\n")
                  f.write(url + "\n")

          print(f"\nDone! Total unique channels: {len(merged)}")
          print(f"Output written to: {OUTPUT_FILE}")
          EOF

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet playlist.m3u; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Playlist has been updated."
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git commit -m "chore: update merged IPTV playlist $(date -u +%Y-%m-%d)"
          git push
