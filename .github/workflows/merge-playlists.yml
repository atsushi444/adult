name: Merge IPTV Playlists

on:
  schedule:
    # 每 6 小时运行一次（UTC 时间）
    - cron: '0 */6 * * *'
  workflow_dispatch:   # 支持手动触发

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Merge playlists
        run: |
          python3 << 'EOF'
          import urllib.request
          import re
          from pathlib import Path

          # ========== 配置 ==========
          SOURCES_FILE = "sources.txt"
          PERSONAL_FILE = "personal.m3u"
          OUTPUT_FILE = "playlist.m3u"
          # =========================

          def download(url: str) -> str:
              try:
                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0 (compatible; IPTV-Merger/1.0)"}
                  )
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return resp.read().decode("utf-8", errors="ignore")
              except Exception as e:
                  print(f"[WARN] Failed to download {url}: {e}")
                  return ""

          def parse_m3u(content: str):
              """解析 M3U，返回 [(extinf, url), ...]"""
              lines = [line.strip() for line in content.splitlines() if line.strip()]
              channels = []
              i = 0
              while i < len(lines):
                  if lines[i].startswith("#EXTINF"):
                      extinf = lines[i]
                      i += 1
                      if i < len(lines) and not lines[i].startswith("#"):
                          url = lines[i]
                          channels.append((extinf, url))
                  i += 1
              return channels

          # 收集所有频道
          all_channels = []
          seen_urls = set()

          # 1. 优先加入 personal.m3u
          if Path(PERSONAL_FILE).exists():
              print(f"Loading personal: {PERSONAL_FILE}")
              content = Path(PERSONAL_FILE).read_text(encoding="utf-8", errors="ignore")
              for extinf, url in parse_m3u(content):
                  if url not in seen_urls:
                      seen_urls.add(url)
                      all_channels.append((extinf, url))

          # 2. 读取 sources.txt 并下载
          if Path(SOURCES_FILE).exists():
              with open(SOURCES_FILE, encoding="utf-8") as f:
                  sources = [line.strip() for line in f if line.strip() and not line.startswith("#")]
          else:
              sources = []

          for url in sources:
              print(f"Downloading: {url}")
              content = download(url)
              if not content:
                  continue
              for extinf, stream_url in parse_m3u(content):
                  if stream_url not in seen_urls:
                      seen_urls.add(stream_url)
                      all_channels.append((extinf, stream_url))

          # 3. 生成最终文件
          header = "#EXTM3U\n"
          body = "\n".join(f"{extinf}\n{url}" for extinf, url in all_channels)
          final_content = header + body + "\n"

          Path(OUTPUT_FILE).write_text(final_content, encoding="utf-8")
          print(f"Merged {len(all_channels)} unique channels → {OUTPUT_FILE}")
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add playlist.m3u

          if git diff --staged --quiet; then
            echo "No changes detected, skip commit."
          else
            git commit -m "chore: update merged IPTV playlist $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
