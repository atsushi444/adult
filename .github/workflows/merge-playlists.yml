name: Merge IPTV Playlists

on:
  schedule:
    # 每天北京时间 8:00（UTC 0:00）
    - cron: '0 0 * * *'
  workflow_dispatch:   # 支持手动触发

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # 防止死链检测拖太久

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Merge + Dead Link Check
        run: |
          python3 << 'EOF'
          import urllib.request
          import concurrent.futures
          import time
          from pathlib import Path

          # ========== 配置 ==========
          SOURCES_FILE = "sources.txt"
          PERSONAL_FILE = "personal.m3u"
          OUTPUT_FILE = "playlist.m3u"

          TIMEOUT = 10          # 单个流检测超时（秒）
          MAX_WORKERS = 30      # 并发检测数量
          # =========================

          def download(url: str) -> str:
              try:
                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0 (compatible; IPTV-Merger/1.1)"}
                  )
                  with urllib.request.urlopen(req, timeout=25) as resp:
                      return resp.read().decode("utf-8", errors="ignore")
              except Exception as e:
                  print(f"[WARN] Download failed: {url} -> {e}")
                  return ""

          def parse_m3u(content: str):
              lines = [line.strip() for line in content.splitlines() if line.strip()]
              channels = []
              i = 0
              while i < len(lines):
                  if lines[i].startswith("#EXTINF"):
                      extinf = lines[i]
                      i += 1
                      if i < len(lines) and not lines[i].startswith("#"):
                          url = lines[i]
                          channels.append((extinf, url))
                  i += 1
              return channels

          def is_alive(url: str) -> bool:
              """检测流是否可用（优先 HEAD，失败再试 GET）"""
              headers = {
                  "User-Agent": "Mozilla/5.0 (compatible; IPTV-Checker/1.1)",
                  "Accept": "*/*",
                  "Connection": "close",
              }
              try:
                  # 先尝试 HEAD
                  req = urllib.request.Request(url, method="HEAD", headers=headers)
                  with urllib.request.urlopen(req, timeout=TIMEOUT) as resp:
                      code = resp.getcode()
                      if 200 <= code < 400:
                          return True
              except Exception:
                  pass

              try:
                  # 再尝试 GET（只读前几 KB，适合很多不支持 HEAD 的源）
                  req = urllib.request.Request(url, method="GET", headers=headers)
                  with urllib.request.urlopen(req, timeout=TIMEOUT) as resp:
                      code = resp.getcode()
                      if 200 <= code < 400:
                          # 读一点内容确认不是空响应
                          data = resp.read(1024)
                          return len(data) > 0
              except Exception:
                  return False
              return False

          # ---------- 收集频道 ----------
          all_channels = []
          seen_urls = set()

          # 1. personal.m3u 优先
          if Path(PERSONAL_FILE).exists():
              print(f"Loading personal: {PERSONAL_FILE}")
              content = Path(PERSONAL_FILE).read_text(encoding="utf-8", errors="ignore")
              for extinf, url in parse_m3u(content):
                  if url not in seen_urls:
                      seen_urls.add(url)
                      all_channels.append((extinf, url))

          # 2. 从 sources.txt 下载
          if Path(SOURCES_FILE).exists():
              with open(SOURCES_FILE, encoding="utf-8") as f:
                  sources = [line.strip() for line in f if line.strip() and not line.startswith("#")]
          else:
              sources = []

          for src in sources:
              print(f"Downloading source: {src}")
              content = download(src)
              if not content:
                  continue
              for extinf, stream_url in parse_m3u(content):
                  if stream_url not in seen_urls:
                      seen_urls.add(stream_url)
                      all_channels.append((extinf, stream_url))

          print(f"\nTotal unique channels before check: {len(all_channels)}")

          # ---------- 死链检测 ----------
          print(f"Starting dead-link check (timeout={TIMEOUT}s, workers={MAX_WORKERS})...")
          start = time.time()

          alive_channels = []
          dead_count = 0

          def check(item):
              extinf, url = item
              return (extinf, url, is_alive(url))

          with concurrent.futures.ThreadPoolExecutor(max_workers=MAX_WORKERS) as executor:
              results = list(executor.map(check, all_channels))

          for extinf, url, alive in results:
              if alive:
                  alive_channels.append((extinf, url))
              else:
                  dead_count += 1

          elapsed = time.time() - start
          print(f"Check finished in {elapsed:.1f}s")
          print(f"Alive: {len(alive_channels)} | Dead: {dead_count}")

          # ---------- 写出结果 ----------
          header = "#EXTM3U\n"
          body = "\n".join(f"{extinf}\n{url}" for extinf, url in alive_channels)
          final_content = header + body + "\n"

          Path(OUTPUT_FILE).write_text(final_content, encoding="utf-8")
          print(f"\nSaved {len(alive_channels)} channels → {OUTPUT_FILE}")
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add playlist.m3u

          if git diff --staged --quiet; then
            echo "No changes detected, skip commit."
          else
            git commit -m "chore: update merged IPTV playlist with live check $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
