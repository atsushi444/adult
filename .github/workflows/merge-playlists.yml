name: Merge IPTV Playlists

on:
  schedule:
    # 每天北京时间 16:00（UTC 0:00）
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run merge script
        run: python3 scripts/merge_iptv.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add playlist.m3u dead.m3u README.md

          if git diff --staged --quiet; then
            echo "No changes detected, skip commit."
          else
            git commit -m "chore: update playlist + dead links + README $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
