name: Merge IPTV Playlists

on:
  schedule:
    # 每天北京时间 16:00（UTC 0:00）
    - cron: '0 8 * * *'
  workflow_dispatch:   # 支持手动触发

env:
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Merge + Dead Link Check + Update README
        run: |
          python3 << 'EOF'
          import urllib.request
          import concurrent.futures
          import time
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          # ========== 配置 ==========
          SOURCES_FILE = "sources.txt"
          PERSONAL_FILE = "personal.m3u"
          OUTPUT_FILE = "playlist.m3u"
          DEAD_FILE = "dead.m3u"
          README_FILE = "README.md"

          TIMEOUT = 10
          MAX_WORKERS = 30
          # =========================

          def download(url: str) -> str:
              try:
                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0 (compatible; IPTV-Merger/1.2)"}
                  )
                  with urllib.request.urlopen(req, timeout=25) as resp:
                      return resp.read().decode("utf-8", errors="ignore")
              except Exception as e:
                  print(f"[WARN] Download failed: {url} -> {e}")
                  return ""

          def parse_m3u(content: str):
              lines = [line.strip() for line in content.splitlines() if line.strip()]
              channels = []
              i = 0
              while i < len(lines):
                  if lines[i].startswith("#EXTINF"):
                      extinf = lines[i]
                      i += 1
                      if i < len(lines) and not lines[i].startswith("#"):
                          url = lines[i]
                          channels.append((extinf, url))
                  i += 1
              return channels

          def is_alive(url: str) -> bool:
              headers = {
                  "User-Agent": "Mozilla/5.0 (compatible; IPTV-Checker/1.2)",
                  "Accept": "*/*",
                  "Connection": "close",
              }
              try:
                  req = urllib.request.Request(url, method="HEAD", headers=headers)
                  with urllib.request.urlopen(req, timeout=TIMEOUT) as resp:
                      if 200 <= resp.getcode() < 400:
                          return True
              except Exception:
                  pass

              try:
                  req = urllib.request.Request(url, method="GET", headers=headers)
                  with urllib.request.urlopen(req, timeout=TIMEOUT) as resp:
                      if 200 <= resp.getcode() < 400:
                          data = resp.read(1024)
                          return len(data) > 0
              except Exception:
                  return False
              return False

          # ---------- 收集频道 ----------
          all_channels = []
          seen_urls = set()

          if Path(PERSONAL_FILE).exists():
              print(f"Loading personal: {PERSONAL_FILE}")
              content = Path(PERSONAL_FILE).read_text(encoding="utf-8", errors="ignore")
              for extinf, url in parse_m3u(content):
                  if url not in seen_urls:
                      seen_urls.add(url)
                      all_channels.append((extinf, url))

          if Path(SOURCES_FILE).exists():
              with open(SOURCES_FILE, encoding="utf-8") as f:
                  sources = [line.strip() for line in f if line.strip() and not line.startswith("#")]
          else:
              sources = []

          for src in sources:
              print(f"Downloading source: {src}")
              content = download(src)
              if not content:
                  continue
              for extinf, stream_url in parse_m3u(content):
                  if stream_url not in seen_urls:
                      seen_urls.add(stream_url)
                      all_channels.append((extinf, stream_url))

          print(f"\nTotal unique channels before check: {len(all_channels)}")

          # ---------- 死链检测 ----------
          print(f"Starting dead-link check (timeout={TIMEOUT}s, workers={MAX_WORKERS})...")
          start = time.time()

          alive_channels = []
          dead_channels = []

          def check(item):
              extinf, url = item
              return (extinf, url, is_alive(url))

          with concurrent.futures.ThreadPoolExecutor(max_workers=MAX_WORKERS) as executor:
              results = list(executor.map(check, all_channels))

          for extinf, url, alive in results:
              if alive:
                  alive_channels.append((extinf, url))
              else:
                  dead_channels.append((extinf, url))

          elapsed = time.time() - start
          print(f"Check finished in {elapsed:.1f}s")
          print(f"Alive: {len(alive_channels)} | Dead: {len(dead_channels)}")

          # ---------- 写出 playlist.m3u ----------
          header = "#EXTM3U\n"
          alive_body = "\n".join(f"{extinf}\n{url}" for extinf, url in alive_channels)
          Path(OUTPUT_FILE).write_text(header + alive_body + "\n", encoding="utf-8")
          print(f"Saved {len(alive_channels)} alive channels → {OUTPUT_FILE}")

          # ---------- 写出 dead.m3u ----------
          dead_body = "\n".join(f"{extinf}\n{url}" for extinf, url in dead_channels)
          Path(DEAD_FILE).write_text(header + dead_body + "\n", encoding="utf-8")
          print(f"Saved {len(dead_channels)} dead channels → {DEAD_FILE}")

          # ---------- 更新 README ----------
          # 北京时间 = UTC+8
          beijing_tz = timezone(timedelta(hours=8))
          now_beijing = datetime.now(beijing_tz).strftime("%Y-%m-%d %H:%M:%S")

          status_block = f"""<!-- IPTV-STATUS-START -->
## 📊 更新状态

- **最后更新时间**：{now_beijing}（北京时间）
- **存活频道**：{len(alive_channels)}
- **死亡频道**：{len(dead_channels)}
- **播放列表**：[{OUTPUT_FILE}]({OUTPUT_FILE})
- **死链列表**：[{DEAD_FILE}]({DEAD_FILE})
<!-- IPTV-STATUS-END -->
"""

          readme_path = Path(README_FILE)
          if readme_path.exists():
              content = readme_path.read_text(encoding="utf-8")
              import re
              pattern = r"<!-- IPTV-STATUS-START -->.*?<!-- IPTV-STATUS-END -->"
              if re.search(pattern, content, flags=re.DOTALL):
                  new_content = re.sub(pattern, status_block.strip(), content, flags=re.DOTALL)
              else:
                  # 没有标记就插入到文件最前面
                  new_content = status_block + "\n" + content
          else:
              new_content = f"# IPTV Playlist Merger\n\n{status_block}"

          readme_path.write_text(new_content, encoding="utf-8")
          print(f"Updated {README_FILE} with latest status")
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add playlist.m3u dead.m3u README.md

          if git diff --staged --quiet; then
            echo "No changes detected, skip commit."
          else
            git commit -m "chore: update playlist + dead links + README $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
